<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Offline · Şagird Gündəliyi</title>
<style>
  :root { --bg:#f7f4ee; --ink:#1d232f; --muted:#6b7280; --accent:#2f4fb5; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14161b; --ink:#e9e6df; --muted:#9aa0ab; --accent:#8ea6ff; } }
  body { margin:0; min-height:100dvh; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,Arial,sans-serif; padding:24px; box-sizing:border-box; }
  main { max-width:340px; text-align:center; }
  img { width:56px; height:56px; border-radius:14px; }
  h1 { font-size:20px; margin:16px 0 8px; }
  p { color:var(--muted); font-size:15px; line-height:1.5; margin:4px 0; }
  button { margin-top:20px; background:var(--accent); color:#fff; border:0; border-radius:12px; padding:12px 18px; font-size:15px; font-weight:600; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>İnternet yoxdur · No internet · Нет интернета</h1>
  <p>Bu səhifə hələ bu cihazda saxlanılmayıb.</p>
  <p>This page hasn't been saved on this device yet.</p>
  <p>Эта страница ещё не сохранена на этом устройстве.</p>
  <button onclick="location.reload()">Yenidən yoxla · Retry · Повторить</button>
</main>
</body>
</html>
